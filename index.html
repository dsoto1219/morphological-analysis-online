<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="libhfst.js" defer></script>
    <script src="langInfo.js"></script> <!-- doesn't need to be deferred, since it only contains js code -->
    <script src="script.js" defer></script>
    <title>Morphological Analyzer</title>
</head>
<body class="d-flex flex-column min-vh-100">
    <main>
        <h1 class="p-2 title">Morphological Analysis</h1>
        <div class="container-sm">
            <select class="form-select mb-3 langSelect" aria-label="Default select example">
                <option value="english">English</option>
                <option value="french">French</option>
                <option value="italian">Italian</option>
                <option value="german">German</option>
                <option value="swedish">Swedish</option>
                <option value="finnish">Finnish</option>
            </select>
            <div class="d-flex flex-wrap justify-content-between credits">
                <div class="analyzer-name"></div>
                <div class="authors"></div>
            </div>
            <div class="d-flex gap-2">
                <input class="form-control textInput" autofocus type="text"> 
                <button class="btn btn-primary align-self-end analyzeButton" disabled>Analyze</button>
            </div>
            <div class="d-flex my-3 gap-2 resultsDiv"></div>
        </div>
    </main>
    <footer class="mt-auto py-3 bg-light">
        <div class="container">
            <span class="text-muted small citation"></span>
        </div>
    </footer>
</body>
</html>
